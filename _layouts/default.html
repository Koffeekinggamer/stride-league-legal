<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}Stride League</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.55;
      color: #1c1c1c;
      background: #fff;
    }
    header, main { max-width: 40rem; margin: 0 auto; padding: 1rem 1rem 0; }
    main { padding-bottom: 3rem; }
    .brand { margin: 0 0 0.5rem; font-weight: 650; }
    .brand a { color: inherit; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; margin-bottom: 0.5rem; }
    nav a {
      color: #0b6b3a;
      text-decoration: underline;
      text-underline-offset: 0.15em;
      padding: 0.35rem 0;
    }
    h1 { font-size: 1.75rem; line-height: 1.2; margin: 0.75rem 0 0.75rem; }
    h2 { font-size: 1.25rem; line-height: 1.3; margin: 1.75rem 0 0.5rem; }
    p, li { margin: 0.6rem 0; }
    a { color: #0b6b3a; }
    ul, ol { padding-left: 1.25rem; }
    strong { font-weight: 650; }
  </style>
</head>
<body>
  <header>
    <p class="brand"><a href="{{ '/' | relative_url }}">Stride League</a></p>
    <nav>
      <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
      <a href="{{ '/terms/' | relative_url }}">Terms</a>
      <a href="{{ '/delete-account/' | relative_url }}">Delete your account</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
