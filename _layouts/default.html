<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Stride League</title>
  <link rel="icon" href="{{ '/assets/stride-icon.svg' | relative_url }}" type="image/svg+xml">
  {% include styles.html accent="#0F3D2A" %}
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/stride-icon.svg' | relative_url }}" alt="" width="36" height="36">
        <span>Stride League</span>
      </a>
      <a class="all-apps" href="{{ '/' | relative_url }}">All apps</a>
    </div>
    <main id="content">
      {{ content }}
    </main>
    <footer>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/support/' | relative_url }}">Support</a>
      <a href="{{ '/delete-account/' | relative_url }}">Delete account</a>
      <a href="{{ '/security/' | relative_url }}">Security</a>
      <a href="{{ '/terms/' | relative_url }}">Terms</a>
    </footer>
  </div>
</body>
</html>
